# ============================================================
# ГЛОБАЛЬНАЯ КОНФИГУРАЦИЯ
# ============================================================
dns:
  # DNS серверы для резолвинга доменов (порядок приоритета)
  nameservers:
    - 77.88.8.8
    - 77.88.8.1
    - 8.8.8.8
    - 1.1.1.1
  
  # Таймаут для резолвинга (секунды)
  timeout: 10
  
  # Максимальное количество параллельных DNS запросов
  max_workers: 20

