name: Update IP List and Create Release

on:
  schedule:
    - cron: '0 4 * * *' # Запуск ежедневно в 04:00 UTC
  workflow_dispatch:    # Позволяет запускать процесс вручную через интерфейс GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает права на создание/обновление релиза и тега

    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Get current date and trigger type
        id: date
        run: |
          echo "CURRENT_DATE=$(date +'%d.%m.%Y')" >> $GITHUB_ENV
          echo "CURRENT_DATETIME=$(date +'%d-%m-%Y_%H-%M')" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_LABEL=manual" >> $GITHUB_ENV
          else
            echo "RELEASE_LABEL=auto" >> $GITHUB_ENV
          fi

      - name: Generate artifacts
        run: |
          python main.py -o ip-list-${{ env.CURRENT_DATETIME }}.json -f amnezia
          jq -r '.[].hostname' ip-list-${{ env.CURRENT_DATETIME }}.json > cidrs-${{ env.CURRENT_DATETIME }}.txt

      - name: Create or Update Release and Upload Artifacts
        run: |
          cat > release-notes.md <<'EOF'
          Автоматически сгенерированный список IP-адресов и доменов российских сервисов.

          📅 **Дата генерации:** ${{ env.CURRENT_DATETIME }}
          🏷 **Тип запуска:** ${{ env.RELEASE_LABEL }}

          - `ip-list-${{ env.CURRENT_DATETIME }}.json` — для импорта в AmneziaVPN.
          - `cidrs-${{ env.CURRENT_DATETIME }}.txt` — простой список CIDR-диапазонов.
          EOF

          if gh release view latest >/dev/null 2>&1; then
            echo "Release 'latest' exists. Uploading new assets seamlessly..."
            gh release upload latest \
              ip-list-${{ env.CURRENT_DATETIME }}.json \
              cidrs-${{ env.CURRENT_DATETIME }}.txt \
              --clobber

            gh release edit latest \
              --title "Актуальный список IP-адресов (${{ env.CURRENT_DATE }}) [${{ env.RELEASE_LABEL }}]" \
              --notes-file release-notes.md

            # Удаляем старые ассеты, сохраняя непрерывную доступность релиза
            for asset in $(gh release view latest --json assets -q '.assets[].name' 2>/dev/null); do
              if [ "$asset" != "ip-list-${{ env.CURRENT_DATETIME }}.json" ] && [ "$asset" != "cidrs-${{ env.CURRENT_DATETIME }}.txt" ]; then
                gh release delete-asset latest "$asset" -y || true
              fi
            done
          else
            echo "Creating initial 'latest' release..."
            gh release create latest \
              ip-list-${{ env.CURRENT_DATETIME }}.json \
              cidrs-${{ env.CURRENT_DATETIME }}.txt \
              --title "Актуальный список IP-адресов (${{ env.CURRENT_DATE }}) [${{ env.RELEASE_LABEL }}]" \
              --notes-file release-notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}