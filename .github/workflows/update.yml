name: Update IP List and Create Release

on:
  schedule:
    - cron: '0 4 * * *' # Запуск ежедневно в 04:00 UTC
  workflow_dispatch:    # Позволяет запускать процесс вручную через интерфейс GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает права на создание/обновление релиза и тега

    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Get current date and trigger type
        id: date
        run: |
          echo "CURRENT_DATE=$(date +'%d.%m.%Y')" >> $GITHUB_ENV
          echo "CURRENT_DATETIME=$(date +'%d-%m-%Y_%H-%M')" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_LABEL=manual" >> $GITHUB_ENV
          else
            echo "RELEASE_LABEL=auto" >> $GITHUB_ENV
          fi

      - name: Generate artifacts
        run: |
          python main.py -o ip-list.json -f amnezia
          jq -r '.[].hostname' ip-list.json > cidrs.txt

      - name: Clean up old releases and drafts
        run: |
          # Удаляем старые релизы и зависшие черновики по ID через API
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[].id' 2>/dev/null); do
            echo "Deleting release ID: $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          # Удаляем тег latest из git, если он остался без релиза
          git push origin --delete latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Release and Upload Artifacts
        run: |
          cat > release-notes.md <<'EOF'
          Автоматически сгенерированный список IP-адресов и доменов российских сервисов.

          📅 **Дата генерации:** ${{ env.CURRENT_DATETIME }}
          🏷 **Тип запуска:** ${{ env.RELEASE_LABEL }}

          - `ip-list.json` — для импорта в AmneziaVPN.
          - `cidrs.txt` — простой список CIDR-диапазонов.
          EOF

          if gh release view latest >/dev/null 2>&1; then
            echo "Release 'latest' exists. Updating title, notes and artifacts..."
            gh release edit latest \
              --title "Актуальный список IP-адресов (${{ env.CURRENT_DATE }}) [${{ env.RELEASE_LABEL }}]" \
              --notes-file release-notes.md \
              --latest
            gh release upload latest ip-list.json cidrs.txt --clobber
          else
            echo "Creating release 'latest'..."
            gh release create latest \
              ip-list.json \
              cidrs.txt \
              --title "Актуальный список IP-адресов (${{ env.CURRENT_DATE }}) [${{ env.RELEASE_LABEL }}]" \
              --notes-file release-notes.md \
              --latest
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
